<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Video Creator</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0f172a;
            color: white;
            min-height: 100vh;
        }

        header {
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .language-button {
            background: #1e293b;
            color: white;
            border: 1px solid #475569;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
        }

        main {
            max-width: 900px;
            margin: 60px auto;
            padding: 20px;
        }

        .hero {
            text-align: center;
            margin-bottom: 40px;
        }

        .hero h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .hero p {
            color: #94a3b8;
            font-size: 18px;
        }

        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 30px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }

        textarea {
            width: 100%;
            min-height: 180px;
            resize: vertical;
            background: #0f172a;
            color: white;
            border: 1px solid #475569;
            border-radius: 10px;
            padding: 15px;
            font-size: 16px;
            margin-bottom: 25px;
        }

        .settings {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        select {
            width: 100%;
            padding: 13px;
            background: #0f172a;
            color: white;
            border: 1px solid #475569;
            border-radius: 10px;
            font-size: 16px;
        }

        .generate {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 10px;
            background: #6366f1;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .generate:hover {
            opacity: 0.9;
        }

        @media (max-width: 600px) {
            .settings {
                grid-template-columns: 1fr;
            }

            .hero h1 {
                font-size: 30px;
            }

            main {
                margin: 30px auto;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">🎬 AI Video Creator</div>

        <button class="language-button" onclick="changeSiteLanguage()">
            العربية / English
        </button>
    </header>

    <main>

        <section class="hero">
            <h1>حوّل فكرتك إلى فيديو 🎥</h1>
            <p>اكتب السكريبت واختر لغة الفيديو ثم ابدأ الإنشاء</p>
        </section>

        <section class="card">
            
<div class="form-group">
  <label for="videoType">نوع الفيديو</label>

  <select id="videoType" name="videoType">
    <option value="long">فيديو طويل</option>
    <option value="shorts">YouTube Shorts</option>
    <option value="both">فيديو طويل + Shorts</option>
  </select>
</div>
            <label>📝 السكريبت</label>

            <textarea
                id="script"
                placeholder="اكتب السكريبت الذي تريد تحويله إلى فيديو..."
            ></textarea>

            <div class="settings">

    <div>
        <label>🌐 لغة الفيديو</label>

        <select id="videoLanguage">
            <option value="ar">العربية</option>
            <option value="en">English</option>
            <option value="ru">Русский</option>
            <option value="hi">हिन्दी</option>
        </select>
    </div>

    <div>
        <label>⏱️ مدة الفيديو</label>

        <select id="duration">
            <option value="30">30 ثانية</option>
            <option value="60">60 ثانية</option>
            <option value="90">90 ثانية</option>
            <option value="120">دقيقتان</option>
        </select>
    </div>

    <div>
        <label>🎬 نوع الفيديو</label>

        <select id="videoType">
            <option value="shorts">Shorts</option>
            <option value="story">قصة</option>
            <option value="educational">تعليمي</option>
            <option value="facts">معلومات وحقائق</option>
        </select>
    </div>

    <div>
        <label>🎙️ نوع الصوت</label>

        <select id="voiceType">
            <option value="male">صوت رجل</option>
            <option value="female">صوت امرأة</option>
        </select>
    </div>

</div>

            <button class="generate" onclick="generateVideo()">
                🚀 إنشاء الفيديو
            </button>

        </section>

    </main>

    <script>

    function generateVideo() {
    const script = document.getElementById("script").value.trim();
    const videoLanguage = document.getElementById("videoLanguage").value;
    const duration = document.getElementById("duration").value;
    const videoType = document.getElementById("videoType").value;
    const voiceType = document.getElementById("voiceType").value;

    if (script === "") {
        alert("من فضلك اكتب السكريبت أولاً.");
        return;
    }

    const languageNames = {
        ar: "العربية",
        en: "English",
        ru: "Русский",
        hi: "हिन्दी"
    };

    const typeNames = {
        shorts: "Shorts",
        story: "قصة",
        educational: "تعليمي",
        facts: "معلومات وحقائق"
    };

    const voiceNames = {
        male: "صوت رجل",
        female: "صوت امرأة"
    };

    alert(
        "🎬 جاهز لإنشاء الفيديو!\n\n" +
        "🌐 اللغة: " + languageNames[videoLanguage] + "\n" +
        "⏱️ المدة: " + duration + " ثانية\n" +
        "🎬 النوع: " + typeNames[videoType] + "\n" +
        "🎙️ الصوت: " + voiceNames[voiceType]
    );
}    

        let siteLanguage = "ar";

function changeSiteLanguage() {

    if (siteLanguage === "ar") {

        siteLanguage = "en";

        document.documentElement.lang = "en";
        document.documentElement.dir = "ltr";

        document.querySelector(".logo").textContent = "🎬 AI Video Creator";

        document.querySelector(".language-button").textContent = "العربية / English";

        document.querySelector(".hero h1").textContent =
            "Turn your idea into a video 🎥";

        document.querySelector(".hero p").textContent =
            "Write your script, choose the video language, and start creating";

        document.querySelectorAll("label")[0].textContent =
            "📝 Script";

        document.querySelectorAll("label")[1].textContent =
            "🌐 Video Language";

        document.querySelectorAll("label")[2].textContent =
            "⏱️ Video Duration";

        document.getElementById("script").placeholder =
            "Write the script you want to turn into a video...";

        document.querySelector("#videoLanguage option[value='ar']").textContent =
            "العربية";

        document.querySelector("#videoLanguage option[value='en']").textContent =
            "English";

        document.querySelector("#videoLanguage option[value='ru']").textContent =
            "Русский";

        document.querySelector("#videoLanguage option[value='hi']").textContent =
            "हिन्दी";

        document.querySelector("#duration option[value='30']").textContent =
            "30 seconds";

        document.querySelector("#duration option[value='60']").textContent =
            "60 seconds";

        document.querySelector("#duration option[value='90']").textContent =
            "90 seconds";

        document.querySelector("#duration option[value='120']").textContent =
            "2 minutes";

        document.querySelector(".generate").textContent =
            "🚀 Generate Video";

    } else {

        siteLanguage = "ar";

        document.documentElement.lang = "ar";
        document.documentElement.dir = "rtl";

        document.querySelector(".logo").textContent =
            "🎬 AI Video Creator";

        document.querySelector(".language-button").textContent =
            "العربية / English";

        document.querySelector(".hero h1").textContent =
            "حوّل فكرتك إلى فيديو 🎥";

        document.querySelector(".hero p").textContent =
            "اكتب السكريبت واختر لغة الفيديو ثم ابدأ الإنشاء";

        document.querySelectorAll("label")[0].textContent =
            "📝 السكريبت";

        document.querySelectorAll("label")[1].textContent =
            "🌐 لغة الفيديو";

        document.querySelectorAll("label")[2].textContent =
            "⏱️ مدة الفيديو";

        document.getElementById("script").placeholder =
            "اكتب السكريبت الذي تريد تحويله إلى فيديو...";

        document.querySelector("#videoLanguage option[value='ar']").textContent =
            "العربية";

        document.querySelector("#videoLanguage option[value='en']").textContent =
            "English";

        document.querySelector("#videoLanguage option[value='ru']").textContent =
            "Русский";

        document.querySelector("#videoLanguage option[value='hi']").textContent =
            "हिन्दी";

        document.querySelector("#duration option[value='30']").textContent =
            "30 ثانية";

        document.querySelector("#duration option[value='60']").textContent =
            "60 ثانية";

        document.querySelector("#duration option[value='90']").textContent =
            "90 ثانية";

        document.querySelector("#duration option[value='120']").textContent =
            "دقيقتان";

        document.querySelector(".generate").textContent =
            "🚀 إنشاء الفيديو";
    }
} 

    </script>

</body>
</html>
