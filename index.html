<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Video Creator</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0f172a;
            color: white;
            min-height: 100vh;
        }

        header {
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .language-button {
            background: #1e293b;
            color: white;
            border: 1px solid #475569;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
        }

        main {
            max-width: 900px;
            margin: 60px auto;
            padding: 20px;
        }

        .hero {
            text-align: center;
            margin-bottom: 40px;
        }

        .hero h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .hero p {
            color: #94a3b8;
            font-size: 18px;
        }

        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 30px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }

        textarea {
            width: 100%;
            min-height: 180px;
            resize: vertical;
            background: #0f172a;
            color: white;
            border: 1px solid #475569;
            border-radius: 10px;
            padding: 15px;
            font-size: 16px;
            margin-bottom: 25px;
        }

        .settings {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        select {
            width: 100%;
            padding: 13px;
            background: #0f172a;
            color: white;
            border: 1px solid #475569;
            border-radius: 10px;
            font-size: 16px;
        }

        .generate {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 10px;
            background: #6366f1;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .generate:hover {
            opacity: 0.9;
        }

        @media (max-width: 600px) {
            .settings {
                grid-template-columns: 1fr;
            }

            .hero h1 {
                font-size: 30px;
            }

            main {
                margin: 30px auto;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">🎬 AI Video Creator</div>

        <button class="language-button" onclick="changeSiteLanguage()">
            العربية / English
        </button>
    </header>

    <main>

        <section class="hero">
            <h1>حوّل فكرتك إلى فيديو 🎥</h1>
            <p>اكتب السكريبت أو اتركه فارغًا واختر إعدادات الفيديو</p>
        </section>

        <section class="card">

            <!-- السكريبت - اختياري -->
            <label for="script">📝 السكريبت (اختياري)</label>

            <textarea
                id="script"
                placeholder="اكتب السكريبت أو اتركه فارغًا..."
            ></textarea>

            <div class="settings">

                <!-- لغة الفيديو -->
                <div>
                    <label for="videoLanguage">🌐 لغة الفيديو</label>

                    <select id="videoLanguage">
                        <option value="ar">العربية</option>
                        <option value="en">English</option>
                        <option value="ru">Русский</option>
                        <option value="hi">हिन्दी</option>
                    </select>
                </div>

                <!-- مدة الفيديو -->
                <div>
                    <label for="duration">⏱️ مدة الفيديو</label>

                    <select id="duration">
                        <option value="30">30 ثانية</option>
                        <option value="60">60 ثانية</option>
                        <option value="90">90 ثانية</option>
                        <option value="120">دقيقتان</option>
                    </select>
                </div>

                <!-- نوع الفيديو -->
                <div>
                    <label for="videoType">🎬 نوع الفيديو</label>

                    <select id="videoType">
                        <option value="long">فيديو طويل</option>
                        <option value="shorts">YouTube Shorts</option>
                        <option value="both">فيديو طويل + Shorts</option>
                    </select>
                </div>

                <!-- عدد الـ Shorts -->
                <div>
                    <label for="shortsCount">🔢 عدد الـ Shorts</label>

                    <select id="shortsCount">
                        <option value="auto">تلقائي</option>
                        <option value="1">1 Short</option>
                        <option value="3">3 Shorts</option>
                        <option value="5">5 Shorts</option>
                    </select>
                </div>

                <!-- نوع الصوت -->
                <div>
                    <label for="voiceType">🎙️ نوع الصوت</label>

                    <select id="voiceType">
                        <option value="male">صوت رجل</option>
                        <option value="female">صوت امرأة</option>
                    </select>
                </div>

            </div>

            <button class="generate" onclick="generateVideo()">
                🚀 إنشاء الفيديو
            </button>

        </section>

    </main>

    <script>

        function generateVideo() {

            const script = document.getElementById("script").value.trim();
            const videoLanguage = document.getElementById("videoLanguage").value;
            const duration = document.getElementById("duration").value;
            const videoType = document.getElementById("videoType").value;
            const shortsCount = document.getElementById("shortsCount").value;
            const voiceType = document.getElementById("voiceType").value;

            const languageNames = {
                ar: "العربية",
                en: "English",
                ru: "Русский",
                hi: "हिन्दी"
            };

            const typeNames = {
                long: "فيديو طويل",
                shorts: "YouTube Shorts",
                both: "فيديو طويل + Shorts"
            };

            const voiceNames = {
                male: "صوت رجل",
                female: "صوت امرأة"
            };

            const scriptStatus =
                script === ""
                    ? "سيتم إنشاء السكريبت تلقائيًا"
                    : "تم إدخال سكريبت";

            alert(
                "🎬 جاهز لإنشاء الفيديو!\n\n" +
                "📝 السكريبت: " + scriptStatus + "\n" +
                "🌐 اللغة: " + languageNames[videoLanguage] + "\n" +
                "⏱️ المدة: " + duration + " ثانية\n" +
                "🎬 النوع: " + typeNames[videoType] + "\n" +
                "🔢 عدد الـ Shorts: " + shortsCount + "\n" +
                "🎙️ الصوت: " + voiceNames[voiceType]
            );
        }


        let siteLanguage = "ar";


        function changeSiteLanguage() {

            if (siteLanguage === "ar") {

                siteLanguage = "en";

                document.documentElement.lang = "en";
                document.documentElement.dir = "ltr";

                document.querySelector(".hero h1").textContent =
                    "Turn your idea into a video 🎥";

                document.querySelector(".hero p").textContent =
                    "Write a script or leave it empty and choose your video settings";

                document.querySelector(".language-button").textContent =
                    "العربية / English";

                document.querySelector("label[for='script']").textContent =
                    "📝 Script (Optional)";

                document.querySelector("label[for='videoLanguage']").textContent =
                    "🌐 Video Language";

                document.querySelector("label[for='duration']").textContent =
                    "⏱️ Video Duration";

                document.querySelector("label[for='videoType']").textContent =
                    "🎬 Video Type";

                document.querySelector("label[for='shortsCount']").textContent =
                    "🔢 Number of Shorts";

                document.querySelector("label[for='voiceType']").textContent =
                    "🎙️ Voice Type";

                document.getElementById("script").placeholder =
                    "Write the script or leave it empty...";

                document.querySelector("#videoType option[value='long']").textContent =
                    "Long Video";

                document.querySelector("#videoType option[value='shorts']").textContent =
                    "YouTube Shorts";

                document.querySelector("#videoType option[value='both']").textContent =
                    "Long Video + Shorts";

                document.querySelector("#shortsCount option[value='auto']").textContent =
                    "Automatic";

                document.querySelector("#shortsCount option[value='1']").textContent =
                    "1 Short";

                document.querySelector("#shortsCount option[value='3']").textContent =
                    "3 Shorts";

                document.querySelector("#shortsCount option[value='5']").textContent =
                    "5 Shorts";

                document.querySelector("#voiceType option[value='male']").textContent =
                    "Male Voice";

                document.querySelector("#voiceType option[value='female']").textContent =
                    "Female Voice";

                document.querySelector("#duration option[value='30']").textContent =
                    "30 seconds";

                document.querySelector("#duration option[value='60']").textContent =
                    "60 seconds";

                document.querySelector("#duration option[value='90']").textContent =
                    "90 seconds";

                document.querySelector("#duration option[value='120']").textContent =
                    "2 minutes";

                document.querySelector(".generate").textContent =
                    "🚀 Generate Video";

            } else {

                siteLanguage = "ar";

                document.documentElement.lang = "ar";
                document.documentElement.dir = "rtl";

                document.querySelector(".hero h1").textContent =
                    "حوّل فكرتك إلى فيديو 🎥";

                document.querySelector(".hero p").textContent =
                    "اكتب السكريبت أو اتركه فارغًا واختر إعدادات الفيديو";

                document.querySelector(".language-button").textContent =
                    "العربية / English";

                document.querySelector("label[for='script']").textContent =
                    "📝 السكريبت (اختياري)";

                document.querySelector("label[for='videoLanguage']").textContent =
                    "🌐 لغة الفيديو";

                document.querySelector("label[for='duration']").textContent =
                    "⏱️ مدة الفيديو";

                document.querySelector("label[for='videoType']").textContent =
                    "🎬 نوع الفيديو";

                document.querySelector("label[for='shortsCount']").textContent =
                    "🔢 عدد الـ Shorts";

                document.querySelector("label[for='voiceType']").textContent =
                    "🎙️ نوع الصوت";

                document.getElementById("script").placeholder =
                    "اكتب السكريبت أو اتركه فارغًا...";

                document.querySelector("#videoType option[value='long']").textContent =
                    "فيديو طويل";

                document.querySelector("#videoType option[value='shorts']").textContent =
                    "YouTube Shorts";

                document.querySelector("#videoType option[value='both']").textContent =
                    "فيديو طويل + Shorts";

                document.querySelector("#shortsCount option[value='auto']").textContent =
                    "تلقائي";

                document.querySelector("#shortsCount option[value='1']").textContent =
                    "1 Short";

                document.querySelector("#shortsCount option[value='3']").textContent =
                    "3 Shorts";

                document.querySelector("#shortsCount option[value='5']").textContent =
                    "5 Shorts";

                document.querySelector("#voiceType option[value='male']").textContent =
                    "صوت رجل";

                document.querySelector("#voiceType option[value='female']").textContent =
                    "صوت امرأة";

                document.querySelector("#duration option[value='30']").textContent =
                    "30 ثانية";

                document.querySelector("#duration option[value='60']").textContent =
                    "60 ثانية";

                document.querySelector("#duration option[value='90']").textContent =
                    "90 ثانية";

                document.querySelector("#duration option[value='120']").textContent =
                    "دقيقتان";

                document.querySelector(".generate").textContent =
                    "🚀 إنشاء الفيديو";
            }
        }

    </script>

</body>
</html>
